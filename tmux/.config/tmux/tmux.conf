# --- Core ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",alacritty:RGB"
set -sg escape-time 0
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on

# --- Splits with Ctrl+Shift+Arrow ---
bind -n C-S-Right split-window -h -c "#{pane_current_path}"
bind -n C-S-Down  split-window -v -c "#{pane_current_path}"
bind -n M-q       kill-pane

# --- Move between panes with Ctrl+Arrow ---
bind -n C-Left  select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up    select-pane -U
bind -n C-Down  select-pane -D

# --- Resize panes with Alt+Shift+Arrow ---
bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up    resize-pane -U 5
bind -n M-S-Down  resize-pane -D 5

# --- Windows ---
bind -n C-S-T   new-window -c "#{pane_current_path}"
bind -n C-S-Tab next-window
bind -n C-Tab   previous-window


# --- Colors: fallback, overridden by matugen output at the bottom ---
set -g status-style                bg='#1d2021',fg='#ebdbb2'
set -g status-left                 "#[fg=#fabd2f,bold] #S  "
set -g status-right                "#[fg=#83a598] %H:%M "
set -g window-status-current-style "fg=#fb4934,bold"
set -g window-status-format        " #I:#W "
set -g window-status-current-format " #I:#W "
set -g pane-border-style           fg='#3c3836'
set -g pane-active-border-style    fg='#fabd2f'
set -g message-style               bg='#3c3836',fg='#ebdbb2'

# Matugen colours (regenerated by setwall, re-sourced by theme-reload)
source-file -q ~/.cache/matugen/tmux.conf
