# Fixed colour themes for matugen (used instead of wallpaper colours).
#
#   setwall --theme            pick a theme for the current wallpaper (rofi)
#   setwall --theme gruvbox    set it directly;  setwall --theme auto  -> wallpaper colours
#
# Each theme has a [name.dark] and [name.light] palette; `setwall --mode` switches.
# matugen-theme turns these into a full Material scheme, so every template works.
#
# Keys:
#   bg       main background              bg_alt   one step *away* from fg (deepest bg)
#   bg1-bg3  raised surfaces, towards fg  fg / fg_dim / muted   text, secondary text, comments
#   primary / secondary / tertiary        accents (focused border, bar icons, highlights…)
#   red green yellow blue magenta cyan    terminal colours

# ---------------------------------------------------------------- gruvbox
[gruvbox.dark]
bg = "#282828"
bg_alt = "#1d2021"
bg1 = "#3c3836"
bg2 = "#504945"
bg3 = "#665c54"
fg = "#ebdbb2"
fg_dim = "#d5c4a1"
muted = "#928374"
primary = "#fabd2f"
secondary = "#8ec07c"
tertiary = "#fe8019"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"

[gruvbox.light]
