# Run via `setwall` (bin package) (handles mode, --prefer and reloads).
# Generated files go to ~/.cache/matugen unless an app needs them in place.

[config]

# ANSI colours for terminals, harmonised towards the wallpaper's palette
[config.custom_colors]
red     = { color = "#f38ba8", blend = true }
green   = { color = "#a6e3a1", blend = true }
yellow  = { color = "#f9e2af", blend = true }
blue    = { color = "#89b4fa", blend = true }
magenta = { color = "#f5c2e7", blend = true }
cyan    = { color = "#94e2d5", blend = true }

# ---------- shell / X ----------
[templates.colors]
input_path  = "~/.config/matugen/templates/colors.sh"
output_path = "~/.cache/matugen/colors.sh"

[templates.xresources]
input_path  = "~/.config/matugen/templates/colors.Xresources"
output_path = "~/.cache/matugen/colors.Xresources"

# ---------- desktop ----------
[templates.polybar]
input_path  = "~/.config/matugen/templates/polybar.ini"
output_path = "~/.cache/matugen/polybar.ini"

[templates.rofi]
input_path  = "~/.config/matugen/templates/rofi.rasi"
output_path = "~/.cache/matugen/rofi.rasi"

[templates.dunst]
input_path  = "~/.config/matugen/templates/dunst.conf"
output_path = "~/.config/dunst/dunstrc.d/50-matugen.conf"

[templates.gtk3]
input_path  = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path  = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-4.0/gtk.css"

# ---------- terminal apps ----------
[templates.alacritty]
input_path  = "~/.config/matugen/templates/alacritty.toml"
output_path = "~/.cache/matugen/alacritty.toml"

[templates.tmux]
input_path  = "~/.config/matugen/templates/tmux.conf"
output_path = "~/.cache/matugen/tmux.conf"

[templates.neovim]
input_path  = "~/.config/matugen/templates/nvim.lua"
output_path = "~/.cache/matugen/generated.lua"

[templates.yazi]
input_path  = "~/.config/matugen/templates/yazi.toml"
output_path = "~/.config/yazi/theme.toml"

[templates.cava]
input_path  = "~/.config/matugen/templates/cava.theme"
output_path = "~/.config/cava/themes/matugen"

[templates.btop]
input_path  = "~/.config/matugen/templates/btop.theme"
output_path = "~/.config/btop/themes/matugen.theme"

# ---------- apps ----------
[templates.vscode]
input_path  = "~/.config/matugen/templates/vscode.json"
output_path = "~/.cache/matugen/vscode.json"
# settings.json is JSONC (trailing commas); strip them so jq can merge
post_hook   = '''
S=~/.config/Code/User/settings.json T=~/.cache/matugen/vscode-settings.json;
perl -0pe 's/,(\s*[}\]])/$1/g' "$S" | jq -s '.[0] * .[1]' - ~/.cache/matugen/vscode.json > "$T" && [ -s "$T" ] && mv "$T" "$S" || rm -f "$T"
'''

[templates.firefox]
input_path  = "~/.config/matugen/templates/firefox.css"
output_path = "~/.config/mozilla/firefox/0hbo14bf.default-release/chrome/matugen-colors.css"

[templates.darkreader]
input_path  = "~/.config/matugen/templates/dark-reader.json"
output_path = "~/.config/dark-reader/settings.json"
