# Generated by matugen — sourced from tmux.conf
set -g status-style                 "bg={{colors.surface.default.hex}},fg={{colors.on_surface.default.hex}}"
set -g status-left                  "#[fg={{colors.primary.default.hex}},bold] #S  "
set -g status-right                 "#[fg={{colors.outline.default.hex}}] %H:%M "
set -g window-status-style          "fg={{colors.outline.default.hex}}"
set -g window-status-current-style  "fg={{colors.primary.default.hex}},bold"
set -g window-status-activity-style "fg={{colors.tertiary.default.hex}}"
set -g pane-border-style            "fg={{colors.outline_variant.default.hex}}"
set -g pane-active-border-style     "fg={{colors.primary.default.hex}}"
set -g message-style                "bg={{colors.surface_container_high.default.hex}},fg={{colors.on_surface.default.hex}}"
set -g message-command-style        "bg={{colors.surface_container_high.default.hex}},fg={{colors.primary.default.hex}}"
set -g mode-style                   "bg={{colors.primary_container.default.hex}},fg={{colors.on_primary_container.default.hex}}"
set -g popup-border-style           "fg={{colors.primary.default.hex}}"
