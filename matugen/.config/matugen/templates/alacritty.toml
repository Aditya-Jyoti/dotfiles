[colors.primary]
background = '{{colors.surface.default.hex}}'
foreground = '{{colors.on_surface.default.hex}}'

[colors.cursor]
text = '{{colors.surface.default.hex}}'
cursor = '{{colors.primary.default.hex}}'

[colors.vi_mode_cursor]
text = '{{colors.surface.default.hex}}'
cursor = '{{colors.tertiary.default.hex}}'

[colors.search.matches]
foreground = '{{colors.on_tertiary_container.default.hex}}'
background = '{{colors.tertiary_container.default.hex}}'

[colors.search.focused_match]
foreground = '{{colors.on_primary.default.hex}}'
background = '{{colors.primary.default.hex}}'

[colors.footer_bar]
foreground = '{{colors.on_surface.default.hex}}'
background = '{{colors.surface_container_high.default.hex}}'

[colors.hints.start]
foreground = '{{colors.on_secondary.default.hex}}'
background = '{{colors.secondary.default.hex}}'

[colors.hints.end]
foreground = '{{colors.on_secondary_container.default.hex}}'
background = '{{colors.secondary_container.default.hex}}'

[colors.selection]
text = '{{colors.on_primary_container.default.hex}}'
background = '{{colors.primary_container.default.hex}}'

[colors.normal]
black   = '{{colors.surface_container_high.default.hex}}'
red     = '{{colors.red.default.hex}}'
green   = '{{colors.green.default.hex}}'
yellow  = '{{colors.yellow.default.hex}}'
blue    = '{{colors.blue.default.hex}}'
magenta = '{{colors.magenta.default.hex}}'
cyan    = '{{colors.cyan.default.hex}}'
white   = '{{colors.on_surface_variant.default.hex}}'

[colors.bright]
black   = '{{colors.outline.default.hex}}'
red     = '{{colors.red.default.hex | lighten: 8.0}}'
green   = '{{colors.green.default.hex | lighten: 8.0}}'
yellow  = '{{colors.yellow.default.hex | lighten: 8.0}}'
blue    = '{{colors.blue.default.hex | lighten: 8.0}}'
magenta = '{{colors.magenta.default.hex | lighten: 8.0}}'
cyan    = '{{colors.cyan.default.hex | lighten: 8.0}}'
white   = '{{colors.on_surface.default.hex}}'

[colors.dim]
black   = '{{colors.surface_container.default.hex}}'
red     = '{{colors.red.default.hex | lighten: -12.0}}'
green   = '{{colors.green.default.hex | lighten: -12.0}}'
yellow  = '{{colors.yellow.default.hex | lighten: -12.0}}'
blue    = '{{colors.blue.default.hex | lighten: -12.0}}'
magenta = '{{colors.magenta.default.hex | lighten: -12.0}}'
cyan    = '{{colors.cyan.default.hex | lighten: -12.0}}'
white   = '{{colors.outline.default.hex}}'
