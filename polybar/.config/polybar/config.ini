; ==================================================
;  colours: generated by matugen (see matugen/templates/polybar.ini)
; ==================================================
include-file = ~/.cache/matugen/polybar.ini

; ==================================================
;  Bars — launch.sh picks one per monitor:
;    eDP-1 (laptop)  -> bar/laptop   compact
;    anything else   -> bar/monitor  roomy
; ==================================================
[bar/laptop]
monitor         = ${env:MONITOR:}
width           = 99%
height          = 28px
offset-x        = 0.5%
offset-y        = 8px
radius          = 10
fixed-center    = true

wm-restack      = bspwm
enable-ipc      = true

background      = ${colors.background}
foreground      = ${colors.foreground}

separator = "  "
separator-foreground = ${colors.outline-variant}

border-size     = 1
border-color    = ${colors.outline-variant}

padding-left    = 2
padding-right   = 2
module-margin   = 0

font-0 = "FiraCode Nerd Font:size=10;2"
font-1 = "Noto Sans Symbols 2:size=10;2"
font-2 = "Noto Sans:size=10;2"

modules-left    = bspwm title
modules-center  = date
modules-right   = cava wifi bluetooth pulseaudio backlight cputemp ram wattage battery

cursor-click    = pointer

[bar/monitor]
inherit         = bar/laptop
width           = 100%:-16
height          = 38px
offset-x        = 8
offset-y        = 8px
radius          = 10

border-size     = 2

padding-left    = 3
padding-right   = 2
module-margin   = 1

separator       = " "

font-0 = "FiraCode Nerd Font:size=11:weight=bold;3"
font-1 = "Noto Sans Symbols 2:size=11:weight=bold;3"
font-2 = "Noto Sans:size=11:weight=bold;3"

modules-left    = bspwm title
modules-center  = date
modules-right   = cava wifi bluetooth pulseaudio cpu cputemp ram wattage battery

; ==================================================
;  Modules
; ==================================================

; ---------------- BSPWM ----------------
[module/bspwm]
type = internal/bspwm
pin-workspaces = true

label-focused         = 󰮯
label-occupied        = 󰊠
label-empty           = 󱥸
label-urgent          = 󰀦

label-focused-foreground  = ${colors.primary}
label-occupied-foreground = ${colors.icon}
label-empty-foreground    = ${colors.outline}
label-urgent-foreground   = ${colors.error}

label-focused-padding  = 1
label-occupied-padding = 1
label-empty-padding    = 1
label-urgent-padding   = 1

; ---------------- Title (event-driven) ----------------
[module/title]
type = custom/script
exec = ~/.config/polybar/scripts/monitor-title.sh
tail = true
label = %output%
label-maxlen = 60
label-foreground = ${colors.foreground-dim}

; ---------------- Date (click for calendar) ----------------
[module/date]
type     = internal/date
interval = 5
time     = "%H:%M"
date     = "%a %d %b"
format-prefix = "󰥔 "
format-prefix-foreground = ${colors.icon}
; click: calendar popup (khal) under the clock
label    = "%{A1:~/.local/bin/calendar-popup &:}%time%  %date%%{A}"

; --------------------------------------------------
;  Right-side modules share one look:
;  accent-coloured icon (format-*-prefix) + plain value
; --------------------------------------------------

; ---------------- Battery ----------------
[module/battery]
type          = internal/battery
battery       = BAT1
adapter       = ACAD
poll-interval = 10
full-at       = 99
low-at        = 15
time-format   = "%H:%M"

format-discharging = <ramp-capacity> <label-discharging>
format-charging    = <label-charging>
format-low         = <label-low>
format-full        = <label-full>

label-discharging = %percentage%%
label-charging    = %percentage%%
label-low         = %percentage%%  %time%
label-full        = full

ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰂂
ramp-capacity-5 = 󰁹
ramp-capacity-foreground = ${colors.icon}

format-charging-prefix = "󰂄 "
format-charging-prefix-foreground = ${colors.tertiary}
format-full-prefix = "󰁹 "
format-full-prefix-foreground = ${colors.tertiary}
format-low-prefix = "󰂃 "
format-low-prefix-foreground = ${colors.error}
label-low-foreground = ${colors.error}

; ---------------- Music visualizer (only while audio plays) ----------------
[module/cava]
type = custom/script
exec = ~/.config/polybar/scripts/cava.sh 10
tail = true
format-foreground = ${colors.primary}

; ---------------- Volume (event-driven) ----------------
[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <label-volume>
format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.icon}
label-volume = %percentage%%
format-muted-prefix = "󰖁 "
format-muted-prefix-foreground = ${colors.outline}
label-muted = muted
label-muted-foreground = ${colors.outline}
click-right = pavucontrol &

; ---------------- Brightness (event-driven) ----------------
[module/backlight]
type   = internal/backlight
card   = intel_backlight
use-actual-brightness = true
enable-scroll = true
format = <label>
format-prefix = "󰃠 "
format-prefix-foreground = ${colors.icon}
label  = %percentage%%

; ---------------- Power draw ----------------
[module/wattage]
type     = custom/script
exec     = ~/.config/polybar/scripts/wattage.sh
interval = 10
format-prefix = "󱐋 "
format-prefix-foreground = ${colors.icon}
label    = %output%

; ---------------- CPU ----------------
[module/cpu]
type     = internal/cpu
interval = 3
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.icon}
label    = %percentage%%

; ---------------- RAM ----------------
[module/ram]
type     = internal/memory
interval = 5
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.icon}
label    = %percentage_used%%

; ---------------- CPU Temp ----------------
[module/cputemp]
type     = internal/temperature
interval = 5
thermal-zone = 8
base-temperature = 40
warn-temperature = 85
format      = <label>
format-warn = <label-warn>
format-prefix = "󰔏 "
format-prefix-foreground = ${colors.icon}
format-warn-prefix = "󰸁 "
format-warn-prefix-foreground = ${colors.error}
label       = %temperature-c%
label-warn  = %temperature-c%
label-warn-foreground = ${colors.error}

; ---------------- WiFi (icon only) ----------------
[module/wifi]
type          = custom/script
exec          = ~/.config/polybar/scripts/wifi.sh
interval      = 10
click-left    = ~/.config/polybar/scripts/wifi-notify.sh &
label-padding = 1
label-foreground = ${colors.icon}

; ---------------- Bluetooth (icon only) ----------------
[module/bluetooth]
type          = custom/script
exec          = ~/.config/polybar/scripts/bluetooth.sh
interval      = 10
click-left    = ~/.config/polybar/scripts/bluetooth-notify.sh &
label-padding = 1
label-foreground = ${colors.icon}

; ---------------- unused, kept for quick swaps ----------------
[module/disk]
type          = internal/fs
mount-0       = /
interval      = 60
format-mounted-prefix = "󰋊 "
format-mounted-prefix-foreground = ${colors.icon}
label-mounted = %percentage_used%%
