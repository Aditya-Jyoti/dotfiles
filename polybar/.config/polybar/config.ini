; ==================================================
;  colours: generated by matugen (see matugen/templates/polybar.ini)
; ==================================================
include-file = ~/.cache/matugen/polybar.ini

; ==================================================
;  Bars — launch.sh picks one per monitor:
;    eDP-1 (laptop)  -> bar/laptop   compact
;    anything else   -> bar/monitor  roomy
; ==================================================
[bar/laptop]
monitor         = ${env:MONITOR:}
width           = 99%
height          = 28px
offset-x        = 0.5%
offset-y        = 8px
radius          = 10
fixed-center    = true

wm-restack      = bspwm
enable-ipc      = true

background      = ${colors.background}
foreground      = ${colors.foreground}

separator = "  "
separator-foreground = ${colors.outline-variant}

border-size     = 1
border-color    = ${colors.outline-variant}

padding-left    = 2
padding-right   = 2
module-margin   = 0

font-0 = "FiraCode Nerd Font:size=10;2"
font-1 = "Noto Sans Symbols 2:size=10;2"
font-2 = "Noto Sans:size=10;2"

modules-left    = bspwm title
modules-center  = date
modules-right   = wifi bluetooth pulseaudio backlight cputemp ram wattage battery

cursor-click    = pointer

[bar/monitor]
inherit         = bar/laptop
width           = 98.6%
height          = 38px
offset-x        = 0.7%
offset-y        = 10px
radius          = 10

padding-left    = 3
padding-right   = 2
module-margin   = 1

separator       = " "

font-0 = "FiraCode Nerd Font:size=11;3"
font-1 = "Noto Sans Symbols 2:size=11;3"
font-2 = "Noto Sans:size=11;3"

modules-left    = bspwm title
modules-center  = date-long
modules-right   = wifi bluetooth pulseaudio cpu cputemp ram wattage battery

; ==================================================
;  Modules
; ==================================================

; ---------------- BSPWM ----------------
[module/bspwm]
type = internal/bspwm
pin-workspaces = true

label-focused         = 󰮯
label-occupied        = 󰊠
label-empty           = 󱥸
label-urgent          = 󰀦

label-focused-foreground  = ${colors.primary}
label-occupied-foreground = ${colors.tertiary}
label-empty-foreground    = ${colors.outline}
label-urgent-foreground   = ${colors.error}

label-focused-padding  = 1
label-occupied-padding = 1
label-empty-padding    = 1
label-urgent-padding   = 1

; ---------------- Title (event-driven) ----------------
[module/title]
type = custom/script
exec = ~/.config/polybar/scripts/monitor-title.sh
tail = true
label = %output%
label-maxlen = 60
label-foreground = ${colors.foreground-dim}

; ---------------- Date ----------------
[module/date]
type     = internal/date
interval = 5
date     = "%a %d %b"
time     = "%H:%M"
label    = "%date%  %time%"
label-foreground = ${colors.primary}

[module/date-long]
inherit  = module/date
date     = "%A, %d %B"
date-alt = "%d/%m/%Y"
label    = "󰃭 %date%   󱑆 %time%"

; ---------------- Battery ----------------
[module/battery]
type          = internal/battery
battery       = BAT1
adapter       = AC
poll-interval = 10
full-at       = 99
low-at        = 15
time-format   = "%H:%M"

format-discharging = <label-discharging>
format-charging    = <label-charging>
format-low         = <label-low>
format-full        = <label-full>

label-discharging = "󰁹 %percentage%%"
label-charging    = "󰂄 %percentage%%"
label-low         = "󰂃 %percentage%%  %time%"
label-full        = "󱈑 full"
label-charging-foreground = ${colors.tertiary}
label-low-foreground      = ${colors.error}

; ---------------- Volume (event-driven) ----------------
[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume  = <label-volume>
label-volume   = "󰕾 %percentage%%"
label-muted    = "󰖁 muted"
label-muted-foreground = ${colors.outline}
click-right    = pavucontrol &

; ---------------- Brightness (event-driven) ----------------
[module/backlight]
type   = internal/backlight
card   = intel_backlight
use-actual-brightness = true
enable-scroll = true
format = <label>
label  = "󰃠 %percentage%%"

; ---------------- Wattage ----------------
[module/wattage]
type     = custom/script
exec     = ~/.config/polybar/scripts/wattage.sh
interval = 10
label    = %output%
label-foreground = ${colors.foreground-dim}

; ---------------- RAM ----------------
[module/ram]
type     = internal/memory
interval = 5
label    = "󰘚 %percentage_used%%"

; ---------------- CPU Temp ----------------
[module/cputemp]
type     = internal/temperature
interval = 5
thermal-zone = 8
base-temperature = 40
warn-temperature = 85
format      = <label>
format-warn = <label-warn>
label       = "󰍛 %temperature-c%"
label-warn  = "󰍛 %temperature-c%"
label-warn-foreground = ${colors.error}

; ---------------- WiFi ----------------
[module/wifi]
type          = custom/script
exec          = ~/.config/polybar/scripts/wifi.sh
interval      = 10
click-left    = ~/.config/polybar/scripts/wifi-notify.sh &
label-padding = 0

; ---------------- Bluetooth ----------------
[module/bluetooth]
type          = custom/script
exec          = ~/.config/polybar/scripts/bluetooth.sh
interval      = 10
click-left    = ~/.config/polybar/scripts/bluetooth-notify.sh &
label-padding = 0

; ---------------- unused, kept for quick swaps ----------------
[module/cpu]
type     = internal/cpu
interval = 3
label    = " %percentage%%"

[module/disk]
type          = internal/fs
mount-0       = /
interval      = 60
label-mounted = "󰋊 %percentage_used%%"
