; ==================================================
;  colors via xrdb
; ==================================================
[colors]
background  = ${xrdb:background}
foreground  = ${xrdb:foreground}
color0      = ${xrdb:color0}
color4      = ${xrdb:color4}
color11     = ${xrdb:color11}
color12     = ${xrdb:color12}
color13     = ${xrdb:color13}
color15     = ${xrdb:color15}

; ==================================================
;  Bar
; ==================================================
[bar/main]
width           = 99%
height          = 26px
offset-x        = 0.5%
offset-y        = 8px
radius          = 0
fixed-center    = false

wm-restack      = bspwm
enable-ipc      = true

background      = ${colors.background}
foreground      = ${colors.foreground}

separator = "  "
separator-foreground = ${colors.color13}

border-size     = 1
border-color    = ${colors.color15}

padding-left    = 2
padding-right   = 2

font-0 = "FiraCode Nerd Font:size=10;2"

modules-left    = bspwm title
modules-right   = wifi bluetooth cputemp ram wattage battery date 

monitor = ${env:MONITOR:}

; ==================================================
;  Modules
; ==================================================

; ---------------- BSPWM ----------------
[module/bspwm]
type = internal/bspwm
pin-workspaces = true

label-focused         = 󰮯
label-occupied        = 󰊠
label-empty           = 󱥸 

label-focused-foreground  = ${colors.color12}
label-occupied-foreground = ${colors.color11}
label-empty-foreground    = ${colors.foreground}

label-focused-padding  = 1
label-occupied-padding = 1
label-empty-padding    = 1

[module/battery]
type = internal/battery
battery      = BAT1
adapter      = AC
poll-interval = 5
full-at      = 100
low-at       = 10

format-discharging = <label-discharging>
format-charging    = <label-charging>
format-low         = <label-low>
format-full        = <label-full>

label-discharging = "󰁹 %percentage_raw%%  󰞌 %time%"
label-charging    = "󰂄 %percentage_raw%%  󰞌 %time%"
label-low         = "󰂃 %percentage_raw%%  󰞌 %time%"
label-full        = "󱈑 100%  "

time-format = "%H:%M"

; ---------------- Date ----------------
[module/date]
type     = internal/date
interval = 1.0
date     = "%d/%m"
time     = "%H:%M"
label    = "󰃭 %date%  󱑆 %time%"

; ---------------- Wattage ----------------
[module/wattage]
type     = custom/script
exec     = ~/.config/polybar/scripts/wattage.sh
interval = 5
label    = %output%

; ---------------- CPU Usage ----------------
[module/cpu]
type                = internal/cpu
interval            = 2
label               = " %percentage%%"

; ---------------- RAM ----------------
[module/ram]
type                = internal/memory
interval            = 3
label               = "󰘚 %percentage_used%%"

; ---------------- Disk ----------------
[module/disk]
type                = internal/fs
mount-0             = /
interval            = 30
label-mounted       = "󰋊 %percentage_used%%"

; ---------------- CPU Temp ----------------
[module/cputemp]
type                = custom/script
exec                = ~/.config/polybar/scripts/cputemp.sh
interval            = 3
label               = %output%

; [module/title]
; type          = internal/xwindow
; label         = %title%
; label-maxlen  = 43

[module/title]
type = custom/script
exec = ~/.config/polybar/scripts/monitor-title.sh
interval = 0.5
label = %output%
label-maxlen = 60

; ---------------- WiFi ----------------
[module/wifi]
type            = custom/script
exec            = ~/.config/polybar/scripts/wifi.sh
interval        = 5
click-left      = ~/.config/polybar/scripts/wifi-notify.sh &
label-padding = 1
 
; ---------------- Bluetooth ----------------
[module/bluetooth]
type            = custom/script
exec            = ~/.config/polybar/scripts/bluetooth.sh
interval        = 5
click-left      = ~/.config/polybar/scripts/bluetooth-notify.sh &
label-padding = 1

