; ==================================================
;  colors via xrdb
; ==================================================
[colors]
background = ${xrdb:background}
foreground = ${xrdb:foreground}

color0  = ${xrdb:color0}   
color1  = ${xrdb:color1}  
color2  = ${xrdb:color2} 
color3  = ${xrdb:color3}
color4  = ${xrdb:color4}
color5  = ${xrdb:color5}   
color6  = ${xrdb:color6}   
color7  = ${xrdb:color7}  

color8  = ${xrdb:color8} 
color9  = ${xrdb:color9}
color10 = ${xrdb:color10}  
color11 = ${xrdb:color11} 
color12 = ${xrdb:color12}
color13 = ${xrdb:color13}  
color14 = ${xrdb:color14} 
color15 = ${xrdb:color15}


; ==================================================
; Base Bar
; ==================================================
[bar/base]
height = 30px
radius = 8
fixed-center = true
wm-restack = bspwm
enable-ipc = true

offset-y = 10
line-size = 0
border-size = 2
border-color = ${colors.color4}


padding-left = 0
padding-right = 0

background = ${colors.color0}
foreground = ${colors.color15}

font-0 = "FiraCode Nerd Font:size=11;2"

; ==================================================
; Bars
; ==================================================

[bar/left_one]
inherit = bar/base
offset-x = 0.5%
width = 10%
modules-center = bspwm

[bar/left_two]
inherit = bar/base
offset-x = 11%   ; 1 + 10 + 1
width = 20%
height = 29px
offset-y = 11
modules-center = spotify

[bar/middle]
inherit = bar/base
width = 30%
offset-x = 35%   ; (100 - 30) / 2
height = 27px
offset-y = 12
modules-center = title

[bar/right_two]
inherit = bar/base
width = 15%
offset-x = 69%   ; 35 + 30 + 1
modules-center = ram 

[bar/right_one]
inherit = bar/base
width = 15%
offset-x = 84.5%   ; 66 + 10 + 1
height = 28px
modules-center = network battery date 


; ==================================================
; Modules
; ==================================================

; ----------- System Stats ---------------

[module/ram]
type = custom/script
exec = ~/.config/polybar/scripts/ram.sh
label = "󰘚 %output%"
interval = 5


; -------------- Title Bar ---------------

[module/title]
type = custom/script
exec = ~/.config/polybar/scripts/scroll_window_title.sh
tail = true
label = %output%
label-padding = 1

; ---------------- Battery ----------------
[module/battery]
type = internal/battery 
battery = BAT1
adapter = AC
poll-interval = 5

full-at = 100
low-at = 10

format-discharging = <label-discharging>
label-discharging = "󰁹 %percentage_raw%%  "

format-charging = <label-charging>
label-charging = "󰂄 %percentage_raw%%  "

format-low = <label-low>
label-low = "󰂃 %percentage_raw%%  "

format-full = <label-full>
label-full = "󱈑 %percentage_raw%%  "

; ---------------- BSPWM ----------------
[module/bspwm]
type = internal/bspwm
format-padding = 1

label-focused = 󰮯
label-occupied = 󰊠
label-empty = 

label-focused-foreground = ${colors.color12}
label-occupied-foreground = ${colors.color11}
label-empty-foreground = ${colors.color13}

label-focused-padding = 1
label-occupied-padding = 1
label-empty-padding = 1

; ---------------- Date ----------------
[module/date]
type = internal/date
interval = 1.0
date = "%d/%m"
time = "%H:%M"
label = "󰃭 %date%   %time%"

; ---------------- Network ----------------
[module/network]
type = internal/network
interface = wlan0
interface-type = wireless
interval = 3.0
unknown-as-up = true

label-connected = "󰖩  "
label-disconnected = "󱚼  "

; ---------------- Spotify ----------------
[module/spotify]
type = custom/script
tail = true
interval = 1
format-prefix = "  "
exec = ~/.config/polybar/scripts/scroll_spotify_status.sh

