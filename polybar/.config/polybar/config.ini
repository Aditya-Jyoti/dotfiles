; ==================================================
;  colours: generated by matugen (see matugen/templates/polybar.ini)
; ==================================================
include-file = ~/.cache/matugen/polybar.ini

; ==================================================
;  Bars — three separate "islands" per monitor; launch.sh starts
;    <size>-left (workspaces), <size>-center (visualizer), <size>-right
;    (battery + clock), size = laptop on eDP-1, monitor elsewhere.
;  bar/laptop and bar/monitor only hold the shared look (not launched).
; ==================================================
[bar/laptop]
monitor         = ${env:MONITOR:}
height          = 28px
offset-y        = 8px
radius          = 6
fixed-center    = true

wm-restack      = bspwm
enable-ipc      = true

background      = ${colors.background}
foreground      = ${colors.foreground}

separator = "  "
separator-foreground = ${colors.outline-variant}

border-size     = 1
border-color    = ${colors.outline-variant}

padding-left    = 2
padding-right   = 2
module-margin   = 0

font-0 = "FiraCode Nerd Font:size=10;2"

cursor-click    = pointer

[bar/laptop-left]
inherit         = bar/laptop
width           = 250
offset-x        = 8
modules-center  = bspwm

[bar/laptop-center]
inherit         = bar/laptop
width           = 340
offset-x        = 50%:-170
modules-center  = cava

[bar/laptop-right]
inherit         = bar/laptop
width           = 290
offset-x        = 100%:-298
modules-center  = battery date

[bar/monitor]
inherit         = bar/laptop
height          = 38px
radius          = 6
border-size     = 2
padding-left    = 3
padding-right   = 3
module-margin   = 1
separator       = " "
font-0 = "FiraCode Nerd Font:size=11:weight=bold;3"

[bar/monitor-left]
inherit         = bar/monitor
width           = 300
offset-x        = 8
modules-center  = bspwm

[bar/monitor-center]
inherit         = bar/monitor
width           = 400
offset-x        = 50%:-200
modules-center  = cava

[bar/monitor-right]
inherit         = bar/monitor
width           = 340
offset-x        = 100%:-348
modules-center  = battery date

; ==================================================
;  Modules
; ==================================================

; ---------------- BSPWM ----------------
[module/bspwm]
type = internal/bspwm
pin-workspaces = true

label-focused         = 󰮯
label-occupied        = 󰊠
label-empty           = 󱥸
label-urgent          = 󰀦

label-focused-foreground  = ${colors.primary}
label-occupied-foreground = ${colors.icon}
label-empty-foreground    = ${colors.outline}
label-urgent-foreground   = ${colors.error}

label-focused-padding  = 1
label-occupied-padding = 1
label-empty-padding    = 1
label-urgent-padding   = 1

; ---------------- Title (event-driven) ----------------
[module/title]
type = custom/script
exec = ~/.config/polybar/scripts/monitor-title.sh
tail = true
label = %output%
label-maxlen = 60
label-foreground = ${colors.foreground-dim}

; ---------------- Date (click for calendar) ----------------
[module/date]
type     = internal/date
interval = 5
time     = "%H:%M"
date     = "%a %d %b"
format-prefix = "󰥔 "
format-prefix-foreground = ${colors.icon}
; click: calendar popup (khal) under the clock
label    = "%{A1:~/.local/bin/calendar-popup &:}%time%  %date%%{A}"

; --------------------------------------------------
;  Right-side modules share one look:
;  accent-coloured icon (format-*-prefix) + plain value
; --------------------------------------------------

; ---------------- Battery ----------------
; click: control-center popout (Wi-Fi, BT, volume, CPU, RAM… — also super + a)
[module/battery]
type          = internal/battery
battery       = BAT1
adapter       = ACAD
poll-interval = 10
full-at       = 99
low-at        = 15
time-format   = "%H:%M"

format-discharging = <ramp-capacity> <label-discharging>
format-charging    = <label-charging>
format-low         = <label-low>
format-full        = <label-full>

label-discharging = "%{A1:control-center &:}%percentage%%%{A}"
label-charging    = "%{A1:control-center &:}%percentage%%%{A}"
label-low         = "%{A1:control-center &:}%percentage%%  %time%%{A}"
label-full        = "%{A1:control-center &:}%percentage%%%{A}"

ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰂂
ramp-capacity-5 = 󰁹
ramp-capacity-foreground = ${colors.icon}

format-charging-prefix = "󰂄 "
format-charging-prefix-foreground = ${colors.tertiary}
format-full-prefix = "󰁹 "
format-full-prefix-foreground = ${colors.tertiary}
format-low-prefix = "󰂃 "
format-low-prefix-foreground = ${colors.error}
label-low-foreground = ${colors.error}

; ---------------- Music visualizer: braille wave, only while audio plays ----------------
[module/cava]
type = custom/script
exec = ~/.config/polybar/scripts/cava.sh 32
tail = true
format-foreground = ${colors.foreground}

; ---------------- Volume (event-driven) ----------------
[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <label-volume>
format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.icon}
label-volume = %percentage%%
format-muted-prefix = "󰖁 "
format-muted-prefix-foreground = ${colors.outline}
label-muted = muted
label-muted-foreground = ${colors.outline}
click-right = pavucontrol &

; ---------------- Brightness (event-driven) ----------------
[module/backlight]
type   = internal/backlight
card   = intel_backlight
use-actual-brightness = true
enable-scroll = true
format = <label>
format-prefix = "󰃠 "
format-prefix-foreground = ${colors.icon}
label  = %percentage%%

; ---------------- Power draw ----------------
[module/wattage]
type     = custom/script
exec     = ~/.config/polybar/scripts/wattage.sh
interval = 10
format-prefix = "󱐋 "
format-prefix-foreground = ${colors.icon}
label    = %output%

; ---------------- CPU ----------------
[module/cpu]
type     = internal/cpu
interval = 3
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.icon}
label    = %percentage%%

; ---------------- RAM ----------------
[module/ram]
type     = internal/memory
interval = 5
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.icon}
label    = %percentage_used%%

; ---------------- CPU Temp ----------------
[module/cputemp]
type     = internal/temperature
interval = 5
thermal-zone = 8
base-temperature = 40
warn-temperature = 85
format      = <label>
format-warn = <label-warn>
format-prefix = "󰔏 "
format-prefix-foreground = ${colors.icon}
format-warn-prefix = "󰸁 "
format-warn-prefix-foreground = ${colors.error}
label       = %temperature-c%
label-warn  = %temperature-c%
label-warn-foreground = ${colors.error}

; ---------------- WiFi (icon only) ----------------
[module/wifi]
type          = custom/script
exec          = ~/.config/polybar/scripts/wifi.sh
interval      = 10
click-left    = ~/.config/polybar/scripts/wifi-notify.sh &
label-padding = 1
label-foreground = ${colors.icon}

; ---------------- Bluetooth (icon only) ----------------
[module/bluetooth]
type          = custom/script
exec          = ~/.config/polybar/scripts/bluetooth.sh
interval      = 10
click-left    = ~/.config/polybar/scripts/bluetooth-notify.sh &
label-padding = 1
label-foreground = ${colors.icon}

; ---------------- unused, kept for quick swaps ----------------
[module/disk]
type          = internal/fs
mount-0       = /
interval      = 60
format-mounted-prefix = "󰋊 "
format-mounted-prefix-foreground = ${colors.icon}
label-mounted = %percentage_used%%
