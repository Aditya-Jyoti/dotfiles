[cursor]
thickness = 0.1

[cursor.style]
blinking = "On"
shape = "Beam"

[font]
size = 7

[font.normal]
family = "FiraCode Nerd Font"

[window]
opacity = 0.88
blur = true

[window.padding]
x = 15
y = 10

[general]
import = ["~/.cache/matugen/alacritty.toml"]

[env]
TERM = "xterm-256color"

[terminal]
# Programs inside (zellij, nvim, also over ssh) copy with OSC 52; reading the
# clipboard that way stays off
osc52 = "OnlyCopy"

# Every plain window opens a zellij session (alacritty -e … still runs just
# that command). Closing the window ends the session instead of leaving it
# running in the background (detach with Alt d to keep it running), but its
# layout + commands are saved, so it can be resurrected later from the session
# manager (Alt o). Falls back to the plain shell if zellij isn't installed.
[terminal.shell]
program = "/bin/sh"
args = ["-c", "command -v zellij >/dev/null && exec zellij options --on-force-close quit; exec \"$SHELL\""]

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
