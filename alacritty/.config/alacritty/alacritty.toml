[cursor]
thickness = 0.1

[cursor.style]
blinking = "On"
shape = "Beam"

[font]
size = 7

[font.normal]
family = "FiraCode Nerd Font"

[window]
opacity = 0.88
blur = true

[window.padding]
x = 15
y = 10

[general]
import = ["~/.cache/matugen/alacritty.toml"]

[env]
TERM = "xterm-256color"

[terminal]

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
