[cursor]
thickness = 0.1

[cursor.style]
blinking = "On"
shape = "Beam"

[font]
size = 7

[font.normal]
family = "FiraCode Nerd Font"

[window]
opacity = 0.88
blur = true

[window.padding]
x = 15
y = 10

[general]
import = ["~/.cache/matugen/alacritty.toml"]

[env]
TERM = "xterm-256color"

[terminal]
# Programs inside (zellij, nvim, also over ssh) copy with OSC 52; reading the
# clipboard that way stays off
osc52 = "OnlyCopy"

# Every plain window opens a throwaway zellij session via `zterm` (see that
# script: tmp-* sessions are deleted once closed; `zkeep <name>` keeps one).
# alacritty -e … still runs just that command. Plain shell if zterm is missing.
[terminal.shell]
program = "/bin/sh"
args = ["-c", "command -v zterm >/dev/null && exec zterm; exec \"$SHELL\""]

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
