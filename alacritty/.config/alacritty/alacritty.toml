[cursor]
thickness = 0.1

[cursor.style]
blinking = "On"
shape = "Beam"

[font]
size = 7

[font.normal]
family = "FiraCode Nerd Font"

[window]
opacity = 0.88
blur = true

[window.padding]
x = 15
y = 10

[general]
import = ["~/.cache/matugen/alacritty.toml"]

[env]
TERM = "xterm-256color"

[terminal]
# Programs inside (zellij, nvim, also over ssh) copy with OSC 52; reading the
# clipboard that way stays off
osc52 = "OnlyCopy"

# Every plain window opens its own zellij session (alacritty -e … still runs
# just that command). Nothing is saved: closing the window ends the session.
# Detach with Alt d first to keep one running. Plain shell if zellij is missing.
[terminal.shell]
program = "/bin/sh"
args = ["-c", "command -v zellij >/dev/null && exec zellij options --on-force-close quit --session-serialization false; exec \"$SHELL\""]

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
