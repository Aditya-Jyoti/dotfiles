# picom v13 (upstream) — glx, light animations, blur on windows only

backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
unredir-if-possible = true;   # fullscreen games/video bypass the compositor (saves GPU)
log-level = "error";

# corners
corner-radius = 10;

# shadows
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-offset-x = -10;
shadow-offset-y = -8;

# fading (also drives workspace switches)
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 10;

# blur (only visible behind translucent windows, e.g. terminals)
blur-method = "dual_kawase";
blur-strength = 8;
blur-background-frame = false;

# animations — short durations keep it snappy and cheap
animations = (
  {
    triggers = ["open"];
    preset = "appear";       # inverse of close: fade in + grow from 95%
    duration = 0.15;
    scale = 0.95;
  },
  {
    triggers = ["close"];
    preset = "disappear";
    duration = 0.12;
    scale = 0.95;
  },
  {
    triggers = ["show"];
    preset = "appear";
    duration = 0.12;
    scale = 0.98;
  },
  {
    triggers = ["hide"];
    preset = "disappear";
    duration = 0.10;
    scale = 0.98;
  },
  {
    triggers = ["geometry"];
    preset = "geometry-change";
    duration = 0.15;
  }
);

# per-window rules (later rules win)
rules = (
  # bar / desktop: square, no shadow, no blur, no animation
  {
    match = "window_type = 'dock' || window_type = 'desktop' || class_g = 'Polybar'";
    corner-radius = 0;
    shadow = false;
    blur-background = false;
    animations = ();
  },
  # launcher: no blur, keeps its own look
  {
    match = "class_g = 'Rofi'";
    blur-background = false;
    shadow = false;
  },
  # notifications
  {
    match = "window_type = 'notification' || class_g = 'Dunst'";
    blur-background = false;
  },
  # menus / tooltips / popups: no shadow, no blur, no slide
  {
    match = "window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'tooltip' || window_type = 'utility'";
    shadow = false;
    blur-background = false;
    corner-radius = 4;
  },
  # screenshot / selection tools
  {
    match = "class_g = 'slop' || class_g = 'flameshot' || name = 'flameshot'";
    shadow = false;
    blur-background = false;
    corner-radius = 0;
    animations = ();
  },
  # fullscreen: square, no shadow
  {
    match = "fullscreen";
    corner-radius = 0;
    shadow = false;
  },
  # translucent apps
  {
    match = "class_g = 'Spotify'";
    opacity = 0.92;
  }
);
