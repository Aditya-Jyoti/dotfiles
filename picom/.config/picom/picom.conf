backend = "xrender"

corner-radius = 4

# shadows
shadow = true
shadow-radius = 4
shadow-opacity = 0.4
shadow-offset-x = -4
shadow-offset-y = -4
shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
]

# fading
fading = true
fade-in-step = 0.12
fade-out-step = 0.12
fade-delta = 16

# no blur
blur-method = "none"

# performance
vsync = true
use-damage = true
log-level = "error"

