# Use our profile set for the Intel card so headphones and the monitor
# (HDMI/DP audio) are both available as outputs at the same time.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.pci-0000_00_1f.3" } ]
    actions = {
      update-props = {
        # absolute path: ACP only looks in /usr/share for relative names
        device.profile-set = "/home/aditya/.config/wireplumber/profile-sets/intel-analog-hdmi.conf"
      }
    }
  }
]
